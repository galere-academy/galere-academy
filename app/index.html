<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: une app mobile d'abord — barre d'onglets en bas, une vue à la fois (Accueil, Fiches, Jeux, Mon kit, Contacts) ; le dossier administratif comme motif : onglets de classeur, tampons « VALIDÉ » */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --ink:#15213b; --muted:#56627a; --line:#d9dfeb;
  --marker:#ffd23f; --marker-ink:#15213b; --accent:#2747c9; --accent-soft:#e6ebfb;
  --ok:#1f8a5b; --ok-soft:#e2f4ea; --ko:#d1432b; --ko-soft:#fbe6e1;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  --c-qui:#15213b; --c-sante:#e5484d; --c-caf:#f76b15; --c-impots:#8e4ec6; --c-banque:#12a594;
  --c-logement:#3e63dd; --c-emploi:#0090ff; --c-mdph:#d6409f; --c-papiers:#e2a336; --c-droits:#5b5bd6;
  --tint:14%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#172038; --ink:#e9edf6; --muted:#9ba6bf; --line:#2a3552;
  --marker:#ffd23f; --marker-ink:#15213b; --accent:#8ea4ff; --accent-soft:#1f2b52;
  --ok:#5fd19a; --ok-soft:#173a2b; --ko:#ff8a73; --ko-soft:#3d1f1a; --tint:24%; --c-qui:#3a4a73; color-scheme:dark}}
:root[data-theme="dark"]{
  --tint:24%; --c-qui:#3a4a73;
  --bg:#0e1424; --surface:#172038; --ink:#e9edf6; --muted:#9ba6bf; --line:#2a3552;
  --marker:#ffd23f; --marker-ink:#15213b; --accent:#8ea4ff; --accent-soft:#1f2b52;
  --ok:#5fd19a; --ok-soft:#173a2b; --ko:#ff8a73; --ko-soft:#3d1f1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{font-size:calc(100% * var(--fz,1))}
body{color:var(--ink);font-family:var(--body);font-size:calc(16px * var(--fz,1));line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:20px 8px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,7vw,3.1rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.mk{background:var(--marker);color:var(--marker-ink);padding:0 .15em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lede{color:var(--muted);max-width:60ch}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
/* onglets du bas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] .ic{background:var(--marker);color:var(--marker-ink)}
.ic{display:grid;place-items:center;width:44px;height:28px;border-radius:999px}
/* accueil */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.stamp{display:inline-block;border:3px solid currentColor;border-radius:8px;padding:2px 10px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;transform:rotate(-4deg);font-size:.8rem}
.progress{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.big-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.big-btn strong{font-family:var(--display);font-size:1.15rem}
.big-btn span{color:var(--muted);font-size:.9rem}
.big-btn .go{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
/* fiches : onglets de classeur */
.folder{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px var(--r) var(--r) var(--r);padding:20px 16px 16px;display:flex;flex-direction:column;gap:6px;min-height:104px}
.folder::before{content:attr(data-n);position:absolute;top:-1px;left:-1px;transform:translateY(-100%);background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:2px 14px;font-family:var(--display);font-weight:800;font-size:.85rem}
.folder strong{font-family:var(--display);font-size:1.1rem;line-height:1.15}
.folder span{color:var(--muted);font-size:.88rem}
.folder .done{color:var(--ok);font-weight:700}
.fgrid{display:grid;gap:30px 12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding-top:22px}
.fgrid .folder .top{flex-direction:column;align-items:flex-start;gap:10px}
.fgrid .folder strong{font-family:var(--display);font-size:1.02rem;line-height:1.2}
.back{align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700}
.bref{background:var(--marker);color:var(--marker-ink);border-radius:var(--r);padding:16px 16px 16px 18px;display:flex;flex-direction:column;gap:8px}
.bref h3{font-size:1rem;text-transform:uppercase;letter-spacing:.06em}
.bref ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0;padding:12px 14px}
.help{border:2px dashed var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.mots{display:grid;gap:8px}
.mot{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mot b{font-family:var(--display)}
@media (max-width:480px){.mot{grid-template-columns:1fr;gap:2px}}
/* cases à cocher */
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--ok)}
.chk:has(input:checked){background:var(--ok-soft);border-color:var(--ok)}
.chk:has(input:checked) span{text-decoration:line-through;text-decoration-color:var(--ok)}
/* jeux */
.gcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.gcard strong{font-family:var(--display);font-size:1.2rem}
.gcard span{color:var(--muted);font-size:.9rem}
.gcard .tag{align-self:flex-start;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{display:flex;flex-direction:column;gap:14px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.hud .sc{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.q{font-family:var(--display);font-size:clamp(1.25rem,4.6vw,1.75rem);font-weight:600;line-height:1.25}
.sms{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:1.02rem;font-weight:700;min-height:54px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.opt:disabled{cursor:default}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .opt{text-align:center;font-family:var(--display);font-size:1.25rem}
.verdict{position:relative;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft)} .verdict.ko{background:var(--ko-soft)}
.verdict .stamp{align-self:flex-start}
.verdict.ok .stamp{color:var(--ok)} .verdict.ko .stamp{color:var(--ko)}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:13px 18px;font-weight:700;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.end{align-items:flex-start;text-align:left}
.end .big{font-family:var(--display);font-size:3.2rem;font-weight:800;font-variant-numeric:tabular-nums}
/* budget */
.money{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.money{grid-template-columns:1fr}}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.line:last-child{border-bottom:0}
.solde{font-family:var(--display);font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.solde.neg{color:var(--ko)} .solde.pos{color:var(--ok)}
.weeks{display:flex;gap:6px}
.weeks i{flex:1;height:8px;border-radius:999px;background:var(--line)}
.weeks i.on{background:var(--accent)}
.fld{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center}
.fld label{font-size:.95rem}
input[type=number],input[type=text],input[type=tel],input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
/* annuaire */
.num{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.num div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.num b{font-family:var(--display);font-size:1.45rem;font-variant-numeric:tabular-nums;user-select:all}
.num span{font-size:.85rem;color:var(--muted)}
.num .urgent{border-color:var(--ko)} .num .urgent b{color:var(--ko)}
.org{display:flex;flex-direction:column;gap:4px}
.org .tel{font-family:var(--display);font-weight:600;user-select:all}
.org .miss{color:var(--muted);font-style:italic;font-size:.88rem}
.search{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.contact{display:grid;grid-template-columns:minmax(110px,28%) 1fr 1fr;gap:8px;align-items:center}
@media (max-width:560px){.contact{grid-template-columns:1fr 1fr}.contact b{grid-column:1/-1}}
.foot{color:var(--muted);font-size:.85rem}
/* couleurs par thème */
[data-c]{--c:var(--c-qui)}
[data-c=sante]{--c:var(--c-sante)}[data-c=caf]{--c:var(--c-caf)}[data-c=impots]{--c:var(--c-impots)}[data-c=banque]{--c:var(--c-banque)}
[data-c=logement]{--c:var(--c-logement)}[data-c=emploi]{--c:var(--c-emploi)}[data-c=mdph],[data-c=handicap]{--c:var(--c-mdph)}[data-c=papiers]{--c:var(--c-papiers)}[data-c=droits]{--c:var(--c-droits)}
.ico{flex:none;display:grid;place-items:center;width:var(--s,44px);height:var(--s,44px);border-radius:calc(var(--s,44px)*.3);background:var(--c);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 70%,#000)}
.ico svg{width:58%;height:58%}
.mosaic{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:340px}
.mosaic .ico{--s:100%;aspect-ratio:1;width:100%;height:auto}
.mosaic .ico:nth-child(odd){transform:rotate(-4deg)} .mosaic .ico:nth-child(3n){transform:rotate(5deg)}
.folder[data-c]{border-color:color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) var(--tint),var(--surface))}
.folder[data-c]::before{background:var(--c);color:#fff;border-color:var(--c)}
.folder .top{display:flex;gap:12px;align-items:center}
.fhead{display:flex;gap:14px;align-items:center;background:var(--c);color:#fff;border-radius:var(--r);padding:16px}
.fhead .ico{background:rgba(255,255,255,.18);box-shadow:none}
.fhead .eyebrow{color:rgba(255,255,255,.85)}
.fhead h2{color:#fff}
.bref[data-c]{background:color-mix(in srgb,var(--c) var(--tint),var(--surface));color:var(--ink);border-left:6px solid var(--c)}
.bref[data-c] h3{color:var(--c)}
:root[data-theme="dark"] .bref[data-c] h3{color:var(--ink)}
.gcard[data-c]{border-color:color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) var(--tint),var(--surface))}
.gcard .top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.qcard{border-radius:var(--r);padding:16px;background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));display:flex;flex-direction:column;gap:10px}
.qcard .top{display:flex;gap:10px;align-items:center}
.big-btn .ico,.folder .ico,.gcard .ico{--s:46px;color:#fff}
.folder .ico{--s:40px}
.big-btn .lft{display:flex;gap:14px;align-items:center;min-width:0}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--line);margin-right:10px;font-size:.85rem}
.emo{font-size:1.6rem;line-height:1}
.idrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.idrow .btn{padding:8px 10px;font-size:.85rem}
/* démarches */
.dem{border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:var(--r);background:var(--surface);overflow:hidden}
.dem>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px;background:color-mix(in srgb,var(--c) var(--tint),var(--surface))}
.dem>summary::-webkit-details-marker{display:none}
.dem>summary b{font-family:var(--display);font-size:1.05rem;line-height:1.2;flex:1}
.dem>summary .pg{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.dem[open]>summary .chev{transform:rotate(90deg)}
.dem .chev{transition:transform .2s;font-weight:800}
.dem .body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.dem .when{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
.dem ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.dem ol .chk span::before{counter-increment:st;content:counter(st) ". ";font-weight:800;color:var(--c)}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:flex;justify-content:space-between;gap:10px;align-items:center;text-decoration:none;font-weight:700;border:2px solid var(--c);color:var(--ink);border-radius:12px;padding:11px 14px}
.links a::after{content:"↗";font-weight:800;color:var(--c)}
.links a:first-child{background:var(--c);color:#fff}.links a:first-child::after{color:#fff}
/* coffre chiffré */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.vdoc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.vdoc img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line);display:block}
.vdoc span{padding:8px 10px;font-size:.85rem;font-weight:700;line-height:1.25}
.vdoc small{padding:0 10px 8px;color:var(--muted);font-size:.75rem}
.pin{font-family:var(--display);font-size:1.6rem;letter-spacing:.5em;text-align:center}
.tts{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 13px;font:700 .88rem var(--body);cursor:pointer}
.tts[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.fzrow{display:flex;gap:8px}
.fzrow button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 0;font-weight:800;cursor:pointer}
.fzrow button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:10px}
.viewer .vt{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff}
.viewer .vt b{font-family:var(--display)}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer button{background:#fff;color:#000;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.lockbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.err{color:var(--ko);font-weight:700}
/* adresses proches */
.places{display:flex;flex-direction:column;gap:8px}
.place{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c) var(--tint),var(--surface));font-size:.92rem}
.place>b{font-family:var(--display);font-size:.98rem;line-height:1.2}
.place .tel{font-family:var(--display);font-weight:600;user-select:all}
/* feuille de route */
.road{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;position:relative}
.road>li{display:flex;flex-direction:column;gap:8px;padding-left:0}
.road .ph{display:flex;gap:10px;align-items:center}
.road .ph b{font-family:var(--display);font-size:1.05rem}
.dotn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c-droits);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
/* anniversaire */
.bday{background:linear-gradient(135deg,var(--c-sante),var(--c-caf) 45%,var(--marker));color:#15213b;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left}
.bday h2{font-size:1.7rem}
.bday .btn{background:#15213b;color:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.road>li.now{background:color-mix(in srgb,var(--c-droits) var(--tint),var(--surface));border-radius:var(--r);padding:10px}
.road .soon{border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;color:#fff}
/* installation */
.inst{margin:10px 0 0;padding-left:0;list-style:none;counter-reset:i;display:flex;flex-direction:column;gap:10px}
.inst li{counter-increment:i;display:flex;gap:12px;align-items:flex-start;line-height:1.4}
.inst li::before{content:counter(i);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal button{aspect-ratio:1;border:1px solid transparent;background:none;border-radius:10px;font-variant-numeric:tabular-nums;position:relative;font-weight:700;min-width:0;padding:0}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{border-color:var(--ink)}
.cal button.sel{background:var(--ink);color:var(--bg)}
.cal button .dots{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:2px}
.cal button .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.calhd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.calhd button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-weight:800}
.rdv{border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border-radius:0 var(--r) var(--r) 0;padding:14px;display:flex;flex-direction:column;gap:8px}
.rdv .when{font-family:var(--display);font-weight:800;font-size:1.05rem}
.rdv .meta{display:flex;flex-direction:column;gap:2px;font-size:.95rem}
.rdv .meta .tel{font-family:var(--display);font-weight:600;user-select:all}
.rdv .docs{display:flex;flex-direction:column;gap:6px}
.rdv .docs .chk{padding:8px 10px;background:var(--surface)}
.rdv.past{opacity:.6}
.rdv .soon{align-self:flex-start;background:var(--ko);color:#fff;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700}
form.rf{display:grid;gap:10px;grid-template-columns:1fr 1fr}
form.rf .full{grid-column:1/-1}
form.rf label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:700}
form.rf input,form.rf select,form.rf textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.85rem}
.sugg button[aria-pressed="true"]{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
@media (max-width:420px){form.rf{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.6) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
.verdict .stamp{animation:pop .25s ease-out}

vf:[
 {t:"caf",q:"L'APL arrive toute seule quand on emménage.",r:false,e:"Rien n'est automatique : il faut faire la demande sur caf.fr ou l'appli."},
 {t:"caf",q:"Le premier mois d'APL est payé.",r:false,e:"Le 1er mois n'est jamais payé. D'où l'intérêt de demander tout de suite."},
 {t:"caf",q:"On peut toucher la prime d'activité dès 18 ans.",r:true,e:"Oui, pour ceux qui travaillent avec un petit salaire."},
 {t:"caf",q:"La déclaration de grossesse se fait avant la fin du 3e mois.",r:true,e:"Oui. Le médecin ou la sage-femme la fait en général en ligne, et elle part à la CPAM et à la CAF."},
 {t:"caf",q:"La prime à la naissance est versée après la naissance du bébé.",r:false,e:"Elle est versée pendant la grossesse, sous conditions de ressources, après la déclaration de grossesse."},

 {t:"caf",q:"Si je ne signale pas un changement à la CAF, il ne se passe rien.",r:false,e:"Tu devras rembourser ce que tu as touché en trop (un indu)."},
 {t:"sante",q:"Sans mutuelle, c'est moi qui paie ce que la Sécu ne rembourse pas.",r:true,e:"La Sécu paie une partie, la mutuelle le reste. Sinon, c'est pour toi."},
 {t:"sante",q:"La première carte Vitale est payante.",r:false,e:"La 1re carte Vitale est gratuite. Elle existe aussi en appli."},
 {t:"sante",q:"La pilule du lendemain est gratuite et sans ordonnance.",r:true,e:"Oui, pour toutes, en pharmacie."},
 {t:"sante",q:"Les urgences de l'hôpital, c'est pour tous les problèmes de santé.",r:false,e:"Seulement pour les urgences graves. Si tu hésites : le 15 ou le 116 117."},
 {t:"sante",q:"Sans médecin traitant, je suis aussi bien remboursé.",r:false,e:"Tu es beaucoup moins remboursé : 12,60 € à payer au lieu de 2 € avec une mutuelle."},
 {t:"impots",q:"Si je gagne peu, je n'ai pas besoin de déclarer mes revenus.",r:false,e:"On déclare chaque printemps, même si on gagne peu. L'avis d'impôt sert partout."},
 {t:"impots",q:"Les bourses et l'APL se déclarent aux impôts.",r:false,e:"Bourses et APL ne se déclarent pas."},
 {t:"banque",q:"Je peux donner mon RIB à mon employeur.",r:true,e:"Le RIB sert à recevoir ton salaire, l'APL, les remboursements. Tu peux le donner."},
 {t:"banque",q:"Ma banque peut me demander le code reçu par SMS au téléphone.",r:false,e:"Jamais. Tes codes ne se donnent à personne, même à « ta banque »."},
 {t:"logement",q:"L'assurance habitation est facultative.",r:false,e:"Elle est obligatoire."},
 {t:"logement",q:"Visale, c'est seulement pour les plus de 30 ans.",r:false,e:"C'est l'inverse : la caution Visale est gratuite si tu as 30 ans ou moins."},
 {t:"logement",q:"Un ancien de l'ASE est prioritaire pour un logement social pendant 3 ans.",r:true,e:"Oui. La demande se fait sur demande-logement-social.gouv.fr et se renouvelle chaque année."},
 {t:"emploi",q:"Si j'oublie de m'actualiser à France Travail, je suis radié.",r:true,e:"Il faut s'actualiser chaque mois, du 28 au 15."},
 {t:"emploi",q:"Je peux jeter mes fiches de paie au bout d'un an.",r:false,e:"Elles se gardent toute la vie."},
 {t:"emploi",q:"J'ai une semaine pour envoyer mon arrêt maladie à mon employeur.",r:false,e:"Tu as 48 heures. En retard, tu risques de perdre une partie de tes indemnités."},
 {t:"emploi",q:"Si je me blesse sur le trajet du travail, c'est un accident du travail.",r:true,e:"Oui, c'est un accident de trajet. Préviens ton employeur dans les 24 heures."},
 {t:"handicap",q:"Avec une RQTH, je dois le dire à mon employeur.",r:false,e:"Avoir une RQTH ne t'oblige pas à le dire à ton employeur."},
 {t:"droits",q:"Mon pécule m'est versé automatiquement à 18 ans.",r:false,e:"Il faut le demander à la Caisse des dépôts."},
 {t:"droits",q:"J'ai le droit de lire mon dossier ASE.",r:true,e:"Oui, tu peux en faire la demande."},
 {t:"droits",q:"Après 18 ans, l'ASE c'est fini, je ne peux plus demander d'aide.",r:false,e:"Jusqu'à 21 ans, le Département peut continuer à t'accompagner. Et tu peux revenir demander de l'aide."},
 {t:"droits",q:"Ancien de l'ASE étudiant, j'ai la bourse au maximum, sans condition de revenus.",r:true,e:"Oui, c'est un droit pour les anciens de l'ASE."},
 {t:"papiers",q:"Je garde mes factures de téléphone 5 ans.",r:true,e:"Factures, relevés de banque et courriers CAF : 5 ans."},
 {t:"papiers",q:"Je peux donner mon mot de passe ameli à un ami pour qu'il m'aide.",r:false,e:"Ne donne jamais tes mots de passe, même à un ami. Demande plutôt à la France Services ou à ton référent."}

arnaque:[

 {m:"Message : « Prête-moi ta carte bancaire une semaine, je te donne 200 €. »",r:true,e:"C'est illégal et tu risques gros : ton compte peut servir à blanchir de l'argent."},

 {m:"Un « ami » te demande ton identifiant et ton mot de passe ameli pour « régler ton dossier ».",r:true,e:"On ne donne jamais ses mots de passe, même à un ami."},
 {m:"Sur ton compte ameli, une notification indique un remboursement de consultation.",r:false,e:"C'est normal. Vérifie toujours dans l'appli officielle, pas par un lien reçu par SMS."},
 {m:"Annonce : « Super appart pas cher. Je suis à l'étranger, faites un virement de la caution et je vous envoie les clés. »",r:true,e:"Arnaque classique. On ne paie jamais avant d'avoir visité et signé un bail."}

demarches:[
 {id:"cni",fiche:"papiers",titre:"Faire ma carte d'identité",quand:"Dès que la tienne est périmée ou si tu n'en as pas. Elle est gratuite et valable 10 ans. Compte plusieurs semaines, plus avant l'été.",
  etapes:["Fais ta pré-demande en ligne sur le site de l'ANTS (facultatif, mais tu gagnes du temps). Garde le numéro ou le QR code.","Trouve une mairie équipée : ça peut être n'importe laquelle, pas forcément celle de ta commune.","Prends rendez-vous : la plupart des mairies l'exigent.","Va au rendez-vous avec tes papiers originaux. Tu dois venir toi-même : on prend tes empreintes.","Suis ta demande en ligne. Tu reçois un SMS quand la carte est prête si tu as donné ton numéro.","Va la chercher toi-même à la mairie, dans les 3 mois. Après, elle est détruite."],
  pieces:["Numéro de pré-demande (ou formulaire rempli sur place)","Photo d'identité de moins de 6 mois, aux normes","Justificatif de domicile de moins d'1 an (si tu es hébergé : attestation et pièce d'identité de la personne qui t'héberge)","Ton passeport s'il est valide ou périmé depuis moins de 5 ans","Sinon : un acte de naissance de moins de 3 mois (pas besoin si ta commune de naissance est reliée à l'ANTS)"],
  liens:[["Faire ma pré-demande (ANTS)","https://www.service-public.gouv.fr/particuliers/vosdroits/R45668"],["Trouver une mairie équipée","https://passeport.ants.gouv.fr/services/geolocaliser-une-mairie-habilitee"],["Prendre rendez-vous","https://www.service-public.gouv.fr/particuliers/vosdroits/R63715"],["Suivre ma demande","https://www.service-public.gouv.fr/particuliers/vosdroits/R49786"],["Tout savoir (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F1341"]],
  astuce:"La carte d'identité est gratuite. Si un site te demande de payer, ce n'est pas le site officiel. Ensuite, tu peux la mettre dans ton téléphone avec l'appli France Identité."},
 {id:"passeport",fiche:"papiers",titre:"Faire mon passeport",quand:"Avant un voyage hors d'Europe, ou si tu n'as pas de carte d'identité. Valable 10 ans. Anticipe : plusieurs semaines, plus avant l'été.",
  etapes:["Fais ta pré-demande en ligne (facultatif) : tu peux payer le timbre fiscal à la fin.","Sinon, achète le timbre fiscal de 86 € en ligne ou dans un bureau de tabac.","Trouve une mairie équipée et prends rendez-vous.","Va au rendez-vous avec tes papiers originaux (prise d'empreintes).","Suis ta demande en ligne et attends le SMS.","Va le chercher toi-même à la mairie, dans les 3 mois. Tu le signes sur place."],
  pieces:["Numéro de pré-demande","Timbre fiscal de 86 €","Photo d'identité de moins de 6 mois","Justificatif de domicile de moins d'1 an","Ta carte d'identité si elle est valide ou périmée depuis moins de 5 ans, sinon un acte de naissance de moins de 3 mois"],
  liens:[["Faire ma pré-demande","https://www.service-public.gouv.fr/particuliers/vosdroits/R42946"],["Acheter le timbre fiscal","https://www.service-public.gouv.fr/particuliers/vosdroits/R39812"],["Trouver une mairie équipée","https://passeport.ants.gouv.fr/services/geolocaliser-une-mairie-habilitee"],["Prendre rendez-vous","https://www.service-public.gouv.fr/particuliers/vosdroits/R63716"],["Tout savoir (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F14929"]],
  astuce:"Le passeport coûte 86 € : parles-en à ton référent, une aide est parfois possible. Garde la photo de ton passeport dans ton coffre-fort."},
 {id:"acte",fiche:"papiers",titre:"Demander mon acte de naissance",quand:"Pour une carte d'identité, un passeport, un mariage, un dossier administratif. Souvent demandé de moins de 3 mois.",
  etapes:["Né(e) en France : fais la demande gratuite en ligne, ou va à la mairie de ta commune de naissance avec ta pièce d'identité (tu l'as tout de suite).","Né(e) à l'étranger et Français(e) : fais la demande en ligne au service central d'état civil de Nantes (environ 30 jours par courrier).","Indique ton nom, tes prénoms, ta date et ton lieu de naissance, et les noms de tes parents.","Range-le dans ton classeur, intercalaire « Identité »."],
  pieces:["Ta pièce d'identité (si tu vas à la mairie)"],
  liens:[["Demande gratuite : né(e) en France","https://www.service-public.gouv.fr/particuliers/vosdroits/R1406"],["Demande gratuite : né(e) à l'étranger","https://www.service-public.gouv.fr/particuliers/vosdroits/R1405"],["Tout savoir (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F1427"]],
  astuce:"C'est toujours gratuit. Les sites qui font payer un acte de naissance ne sont pas officiels."},
 {id:"jdc",fiche:"papiers",titre:"Me faire recenser et faire ma JDC",quand:"Si tu es Français(e) : dans les 3 mois après tes 16 ans (possible jusqu'à 25 ans si tu as oublié).",
  etapes:["Fais-toi recenser à la mairie de ton domicile ou en ligne. Prends ton livret de famille et ta pièce d'identité.","Garde ton attestation de recensement : elle est demandée pour des examens avant 18 ans.","Tu es ensuite convoqué(e) à la Journée défense et citoyenneté (JDC). Vas-y.","Garde ton attestation de JDC : on te la demande pour le permis (de 17 à 24 ans), les examens et les concours (de 18 à 24 ans).","Attestation perdue ? Avant 25 ans, demande une attestation de situation au centre du service national (CSNJ), avec une copie de ta pièce d'identité."],
  pieces:["Pièce d'identité","Livret de famille"],
  liens:[["Le recensement (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F870"],["Mon espace JDC","https://www.service-public.gouv.fr/particuliers/vosdroits/R51719"],["Attestation perdue","https://www.service-public.gouv.fr/particuliers/vosdroits/F1290"]],
  astuce:"Le recensement t'inscrit aussi automatiquement sur les listes électorales à 18 ans."},
 {id:"grossesse",fiche:"caf",titre:"J'attends un enfant",quand:"Dès que tu sais que tu es enceinte. La déclaration de grossesse se fait avant la fin du 3e mois.",
  etapes:["Prends rendez-vous chez un médecin ou une sage-femme pour le 1er examen prénatal, avant la fin du 3e mois.","Il ou elle fait la déclaration de grossesse en ligne : elle part toute seule à la CPAM et à la CAF. Si on te donne un formulaire papier, envoie-le dans les 14 premières semaines.","Mets à jour ta carte Vitale et préviens ta mutuelle ou ta CSS.","Inscris-toi à la maternité dès la fin du 3e mois.","Demande la prime à la naissance à la CAF, en ligne, dans les 6 mois après le début de la grossesse.","Avant le 7e mois : inscris-toi à la préparation à la naissance et, si tu veux une crèche, sur les listes d'attente.","Si les parents ne sont pas mariés, le père peut reconnaître l'enfant à la mairie avant la naissance."],
  pieces:["Carte Vitale","Pièce d'identité","Identifiants CAF et ameli"],
  liens:[["Je deviens parent : toutes les étapes (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F16225"],["La prime à la naissance","https://www.service-public.gouv.fr/particuliers/vosdroits/F2550"],["Reconnaître l'enfant avant la naissance","https://www.service-public.gouv.fr/particuliers/vosdroits/F887"]],
  astuce:"La prime à la naissance (1 093,11 € en 2026, sous conditions de ressources) est versée avant la naissance. La PMI du Département suit gratuitement ta grossesse et ton bébé : demande à ton référent ou à ton assistante sociale."},
 {id:"naissance",fiche:"caf",titre:"Mon bébé est né",quand:"Dans les jours qui suivent la naissance. La déclaration à la mairie se fait dans les 5 jours.",
  etapes:["Déclare la naissance à la mairie du lieu de naissance dans les 5 jours (souvent possible à la maternité).","Déclare la naissance à l'Assurance maladie dans ton compte ameli, ou au 36 46.","Rattache ton enfant à ta carte Vitale (et à celle de l'autre parent).","Déclare la naissance à la CAF en ligne : elle calcule l'allocation de base (jusqu'aux 3 ans de l'enfant).","Fais faire le 1er examen médical du bébé avant ses 8 jours. Une sage-femme peut venir à la maison les premiers jours.","Préviens ton employeur pour les congés : congé maternité, ou congé de naissance et congé paternité pour le second parent."],
  pieces:["Acte de naissance de l'enfant","Livret de famille (s'il existe)","Pièce d'identité des parents","Carnet de santé du bébé (remis par la maternité)"],
  liens:[["Déclarer la naissance","https://www.service-public.gouv.fr/particuliers/vosdroits/F961"],["L'allocation de base de la Paje","https://www.service-public.gouv.fr/particuliers/vosdroits/F2552"],["Je deviens parent : après la naissance","https://www.service-public.gouv.fr/particuliers/vosdroits/F16225"]],
  astuce:"Signale vite la naissance à la CAF : elle peut aussi changer ton APL et ta prime d'activité."},
 {id:"solo",fiche:"caf",titre:"J'élève mon enfant seul(e)",quand:"Dès que tu élèves seul(e) ton enfant sans aide financière de l'autre parent.",
  etapes:["Signale à la CAF que tu vis seul(e) avec ton enfant : tes droits sont recalculés.","Si l'autre parent ne verse pas de pension, demande l'allocation de soutien familial (ASF), sans condition de ressources.","Fais une simulation sur caf.fr ou mesdroitssociaux.gouv.fr pour voir les autres aides (RSA, prime d'activité, aide à la garde).","Parles-en à ton référent ou à ton assistante sociale : la PMI et le Département peuvent aussi t'accompagner."],
  pieces:["Acte de naissance de l'enfant","Pièce d'identité","RIB"],
  liens:[["L'allocation de soutien familial (ASF)","https://pension-alimentaire.caf.fr/usagers/aides-et-demarches/allocation-de-soutien-familial"],["Simulateur de droits","https://www.mesdroitssociaux.gouv.fr/votre-simulateur/accueil"]],
  astuce:"Tu n'as pas à te débrouiller seul(e) : la PMI, ta MDS et la Mission locale peuvent t'aider à trouver une solution de garde pour travailler ou te former."},
 {id:"css",fiche:"sante",titre:"Demander la CSS (mutuelle gratuite ou à petit prix)",quand:"Dès que tes revenus sont faibles, puis chaque année : entre 4 et 2 mois avant la date de fin.",
  etapes:["Vérifie si tu y as droit avec le simulateur mesdroitssociaux.gouv.fr.","Connecte-toi à ton compte ameli et remplis la demande de Complémentaire santé solidaire.","Ajoute tes justificatifs (photo ou scan).","Attends la réponse : 2 mois maximum. Sans réponse au bout de 2 mois, c'est accepté.","Note la date de fin de tes droits dans ton agenda pour renouveler à temps."],
  pieces:["Ton avis d'impôt","Tes justificatifs de ressources si on te les demande"],
  liens:[["Faire la demande en ligne (ameli)","https://www.service-public.gouv.fr/particuliers/vosdroits/R52880"],["Simulateur de droits","https://www.mesdroitssociaux.gouv.fr/votre-simulateur/accueil"],["Formulaire papier (cerfa 12504)","https://www.service-public.gouv.fr/particuliers/vosdroits/R54651"],["Tout savoir (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F10027"]],
  astuce:"Un adulte de confiance peut faire la demande pour toi avec une procuration."},
 {id:"apl",fiche:"caf",titre:"Demander l'APL",quand:"Le mois où tu entres dans ton logement. L'APL est due à partir du mois qui suit ta demande.",
  etapes:["Crée ton compte sur caf.fr si tu n'es pas encore allocataire.","Fais la demande d'aide au logement en ligne.","Ajoute les pièces demandées pendant la démarche.","Suis ton dossier dans ton compte : environ 1 mois de traitement.","Premier versement le 5 du mois. Exemple : entrée le 15 octobre, droits en novembre, versement le 5 décembre."],
  pieces:["Pièce d'identité (ou titre de séjour)","RIB","Attestation de loyer remplie par le propriétaire","Ton bail"],
  liens:[["Faire la demande d'APL (Caf)","https://www.service-public.gouv.fr/particuliers/vosdroits/R1292"],["Tout savoir (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F12006"]],
  astuce:"Fais la simulation sur caf.fr avant de signer : tu sauras combien il te reste vraiment à payer."},
 {id:"prime",fiche:"caf",titre:"Demander la prime d'activité",quand:"Dès que tu travailles avec un petit salaire, à partir de 18 ans.",

 {id:"hlm",fiche:"logement",titre:"Faire ma demande de logement social",quand:"Le plus tôt possible : les délais sont longs. Renouvelle-la chaque année.",
  etapes:["Va sur le service en ligne de demande de logement social (ou demande le formulaire papier n° 14069).","Choisis les communes où tu veux habiter. Hors Île-de-France, il faut un dossier par département.","Remplis ta situation et ajoute tes pièces.","Garde ton attestation : elle contient ton numéro de demande. Note-le dans « Mes numéros ».","Renouvelle ta demande chaque année à la date anniversaire."],
  pieces:["Pièce d'identité recto verso ou titre de séjour","Avis d'impôt","Fiches de paie ou justificatifs de ressources","Tout document sur ta situation (quittance, certificat de scolarité…)"],

 {id:"visale",fiche:"logement",titre:"Obtenir la caution Visale",quand:"Avant de signer le bail, dès le début de ta recherche.",
  etapes:["Crée ton compte locataire sur visale.fr et active-le avec le code reçu par mail.","Dépose tes justificatifs (5 Mo maximum par fichier, renommés).","Reçois ton visa en quelques jours si le dossier est complet. Incomplet : tu as 15 jours pour le compléter.","Donne ton visa au propriétaire : c'est lui qui active la garantie.","Signe le bail avant la fin du visa : 3 mois (6 mois pour les étudiants et les alternants)."],

 {id:"mdph",fiche:"mdph",titre:"Faire un dossier MDPH (AAH, RQTH…)",quand:"Le plus tôt possible : c'est long. Pour un renouvellement, environ 6 mois avant la fin de tes droits.",
  etapes:["Télécharge le formulaire de demande (cerfa 15692) et remplis-le, date et signe.","Demande à ton médecin de remplir le certificat médical (cerfa 15695). Il doit avoir moins de 12 mois.","Remplis si tu peux la partie « vie quotidienne » : ce que tu vis au quotidien. La MDPH ou ton référent peuvent t'aider.","Dépose le dossier à la MDPH de ton département, ou en ligne si ton département propose « MDPH en ligne ».","Tu reçois un accusé de réception. S'il manque un papier, il est indiqué avec une date limite."],
  pieces:["Formulaire cerfa 15692 rempli et signé","Certificat médical cerfa 15695 de moins de 12 mois (original)","Pièce d'identité recto verso","Justificatif de domicile (si tu es hébergé : attestation de la personne qui t'héberge)","Comptes rendus médicaux utiles"],
  liens:[["Formulaire de demande (PDF)","https://www.monparcourshandicap.gouv.fr/sites/default/files/2025-03/Formulaire-demande-MDPH_cerfa_15692-01.pdf"],["Certificat médical (PDF)","https://www.monparcourshandicap.gouv.fr/sites/default/files/2022-05/cerfa_Certificat%20m%C3%A9dical%20MDPH_15695_accessible.pdf"],["Déposer en ligne (MDPH en ligne)","https://mdphenligne.cnsa.fr/"],["Comment déposer son dossier","https://www.monparcourshandicap.gouv.fr/aides/le-depot-du-dossier-et-le-traitement-de-la-demande-par-la-maison-departementale-des-personnes"]],
  astuce:"Fais une copie de tout le dossier avant de l'envoyer et range-la dans ton classeur."},
 {id:"arret",fiche:"emploi",titre:"Je suis en arrêt maladie",quand:"Dès que le médecin te met en arrêt : tu as 48 heures pour l'envoyer.",
  etapes:["Le médecin envoie souvent l'arrêt en ligne à la CPAM. Il te donne alors une seule feuille (volet 3) : envoie-la à ton employeur dans les 48 heures (à France Travail si tu es sans emploi).","Si l'arrêt est sur papier (3 feuilles) : envoie les volets 1 et 2 à ta CPAM et le volet 3 à ton employeur, dans les 48 heures.","Respecte les heures de sortie écrites sur l'arrêt. Si les sorties sont limitées, tu dois être chez toi de 9 h à 11 h et de 14 h à 16 h, même le week-end. Des contrôles peuvent avoir lieu.","Si tu vas dormir ailleurs, note l'adresse sur le volet 1. Pour partir hors du département, demande l'accord de la CPAM avant.","Besoin de prolonger ? Retourne voir le médecin avant la fin de l'arrêt, et renvoie le nouveau papier sous 48 heures.","Tu reprends plus tôt ? Préviens la CPAM sous 24 heures."],
  pieces:["Ton avis d'arrêt de travail","Ta carte Vitale","Ton numéro de sécurité sociale"],
  liens:[["Les démarches du salarié (ameli)","https://www.ameli.fr/assure/droits-demarches/maladie-accident-hospitalisation/arret-travail-maladie/arret-travail-maladie-salarie"],["Indemnités journalières : conditions et montant","https://www.service-public.gouv.fr/particuliers/vosdroits/F3053"],["Les sorties pendant l'arrêt","https://www.service-public.gouv.fr/particuliers/vosdroits/F12415"]],
  astuce:"Les 3 premiers jours ne sont en général pas payés par la Sécu (délai de carence). Pour avoir des indemnités, il faut avoir assez travaillé avant l'arrêt (par exemple 150 heures sur les 3 derniers mois). Si tu envoies ton arrêt en retard, tu peux perdre une partie de l'argent."},
 {id:"accident",fiche:"emploi",titre:"J'ai eu un accident au travail ou sur le trajet",quand:"Le jour même, ou dans les 24 heures au plus tard.",
  etapes:["Préviens ton employeur tout de suite (appel, mail, SMS), dans les 24 heures au plus tard.","Ton employeur déclare l'accident à la CPAM dans les 48 heures. S'il ne le fait pas, tu peux le déclarer toi-même pendant 2 ans.","Demande à ton employeur ta feuille d'accident : montre-la chez le médecin, à la pharmacie… Tes soins sont pris en charge à 100 % sans avancer d'argent.","Va voir le médecin de ton choix : il fait un certificat médical et, si besoin, un arrêt de travail.","La CPAM a 30 jours pour reconnaître l'accident (2 mois de plus si elle enquête). Sans réponse, il est reconnu."],
  pieces:["La feuille d'accident donnée par l'employeur","Le certificat médical","Ta carte Vitale"],
  liens:[["Accident du travail : les démarches (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F171"],["Accident de trajet : c'est quoi ?","https://www.service-public.gouv.fr/particuliers/vosdroits/F31881"],["Les indemnités en cas d'accident","https://www.service-public.gouv.fr/particuliers/vosdroits/F175"]],
  astuce:"Un accident sur le trajet entre chez toi et ton travail compte aussi. Garde une copie de tous les papiers dans ton classeur."},
 {id:"permis",fiche:"emploi",titre:"M'inscrire au permis de conduire",quand:"Dès que tu veux commencer le code.",
  etapes:["Choisis une auto-école (elle peut faire l'inscription pour toi) ou inscris-toi seul en candidat libre.","Connecte-toi à ton compte ANTS (ou avec FranceConnect) et fais une nouvelle demande : « Je m'inscris pour passer les examens du permis ».","Remplis le formulaire et ajoute tes justificatifs.","Reçois ton numéro NEPH en 2 semaines environ. Note-le dans « Mes numéros ».","Inscris-toi ensuite à l'examen du code, puis à la conduite."],
  pieces:["Pièce d'identité","Photo d'identité numérique avec code (cabine ou photographe agréé)","Justificatif de domicile","Attestation de JDC ou de recensement"],
  liens:[["S'inscrire en ligne (ANTS)","https://permisdeconduire.ants.gouv.fr/demarches-en-ligne/inscription-examen-permis"],["Passer le code","https://www.service-public.gouv.fr/particuliers/vosdroits/F33694"],["Le permis en candidat libre","https://www.service-public.gouv.fr/particuliers/vosdroits/F2825"]],

 {id:"permis1",fiche:"emploi",titre:"Financer mon permis (permis à 1 € par jour)",quand:"Avant de signer avec l'auto-école.",
  etapes:["Vérifie que tu as entre 15 et 25 ans.","Choisis une auto-école labellisée qui propose le permis à 1 € par jour et demande un devis.","Signe le contrat, puis demande le prêt à une banque partenaire (600, 800, 1 000 ou 1 200 €).","La banque décide : elle peut demander un justificatif de revenus ou un garant.","Tu rembourses environ 30 € par mois, sans intérêts."],
  pieces:["Devis et contrat de l'auto-école","Pièce d'identité","Justificatifs de revenus si la banque les demande"],
  liens:[["Le permis à 1 € par jour (Sécurité routière)","https://www.securite-routiere.gouv.fr/passer-son-permis-de-conduire/financement-du-permis-de-conduire/permis-1-eu-par-jour/definition-du-permis-1-eu-par-jour"],["Tout savoir (service-public)","https://www.service-public.gouv.fr/particuliers/vosdroits/F10705"]],
  astuce:"C'est un prêt : il faut le rembourser même si tu rates l'examen. Parle aussi du FAJ à ton référent, il peut compléter."},
 {id:"pecule",fiche:"droits",titre:"Récupérer mon pécule",quand:"À tes 18 ans, si tu as été placé à l'ASE avant tes 18 ans.",
  etapes:["Va sur le site de la Caisse des dépôts, rubrique « jeunes majeurs de l'enfance protégée ».","Fais ta demande de restitution de l'allocation de rentrée scolaire mise de côté pour toi.","Suis ta demande et garde le courrier de réponse dans ton classeur."],
  pieces:["Pièce d'identité","RIB à ton nom"],
  liens:[["Faire ma demande (Caisse des dépôts)","https://consignations.caissedesdepots.fr/particulier/restitution-jeunes-majeurs-enfance-protegee/allocation-rentree-scolaire-ars"],["Explications de la Caf","https://caf.fr/allocataires/actualites/actualites-nationales/jeunes-majeurs-issus-de-l-ase-demandez-vos-allocations-de-rentree"]],

 {id:"premaj",fiche:"droits",titre:"Préparer mon entretien de pré-majorité",quand:"À 17 ans, au plus tard un an avant tes 18 ans. Si tu es arrivé(e) à l'ASE après 17 ans, il a lieu le plus vite possible.",
  etapes:["Ton référent ASE te propose une date. Tu peux venir avec ta personne de confiance.","Avant, note tes questions : où je vais habiter, comment je paie ma formation, qui m'aide après 18 ans.","Pendant l'entretien, on fait le bilan de ton parcours et on t'explique tes droits.","Vous construisez ensemble ton projet d'accès à l'autonomie : école ou formation, logement, santé, argent, emploi.","Si tu es de nationalité étrangère, on t'explique comment l'ASE t'aide pour ton titre de séjour (ou une demande d'asile).","Ensuite, le Département te dit comment tu seras accompagné(e) vers l'autonomie. Range ce document dans ton classeur.","Tes besoins changent ? Tu peux demander un nouvel entretien."],
  pieces:["Tes questions écrites (dans les notes de ton téléphone)","Ton projet : école, formation, travail","Tes papiers : carte d'identité ou titre de séjour, carte Vitale","Ton budget si tu l'as fait (Mon kit > Mon budget)"],
  liens:[["Le texte de loi (article L222-5-1)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000045136761"],["Des fiches pour les jeunes de la protection de l'enfance (La B'ASE)","https://www.la-base.org"]],
  astuce:"C'est un droit, pas un examen. Dis ce que tu veux pour après tes 18 ans et pose toutes tes questions."},
 {id:"apjm",fiche:"droits",titre:"Être accompagné(e) après 18 ans (jusqu'à 21 ans)",quand:"À préparer dès 17 ans avec ton référent. Tu peux demander une aide jusqu'à tes 21 ans, même si tu as déjà quitté l'ASE.",
  etapes:["Parles-en avec ton référent, au plus tard pendant ton entretien de pré-majorité.","Fais ta demande par écrit au Département (ton référent t'aide). Explique ton projet et pourquoi tu as besoin d'aide.","Le Département décide. Si c'est oui, tu signes un accompagnement jeune majeur : logement, argent, suivi… selon ta situation.","Respecte tes engagements et fais le point régulièrement avec ton référent.","Ta formation n'est pas finie à la fin de l'accompagnement ? Tu peux être accompagné(e) jusqu'à la fin de l'année scolaire ou universitaire.","Tu as quitté l'ASE et tu as moins de 21 ans ? Tu peux redemander une aide au Département.","On te propose aussi le Contrat d'engagement jeune (CEJ) avec la Mission locale ou France Travail.","Le Département refuse ? Demande la décision par écrit : tu peux la contester. Le Point justice et le Défenseur des droits t'aident gratuitement."],
  pieces:["Ta lettre de demande (ton référent peut t'aider)","Ton projet : formation, travail, logement","Tes justificatifs de ressources (fiches de paie, bourse…)","Ta pièce d'identité ou ton titre de séjour"],
  liens:[["Le texte de loi (article L222-5)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000049050913"],["Le Contrat d'engagement jeune (1jeune1solution)","https://www.1jeune1solution.gouv.fr/contrat-engagement-jeune"],["Le Défenseur des droits","https://www.defenseurdesdroits.fr"]],
  astuce:"La loi vise les jeunes qui n'ont pas assez de ressources ou de soutien familial. Dis-le clairement dans ta demande. Ce droit ne s'applique pas en cas d'obligation de quitter le territoire (OQTF)."},
 {id:"sejour",fiche:"droits",titre:"Mon titre de séjour à 18 ans",quand:"Prépare-le dès 17 ans avec ton référent. Confié(e) à l'ASE au plus tard à 16 ans : demande au plus tard la veille de tes 19 ans. Confié(e) entre 16 et 18 ans : demande le plus tôt possible et vérifie le délai exact avec ton référent.",
  etapes:["Dès 17 ans, parles-en à ton référent : l'ASE doit t'aider dans cette démarche.","Rassemble tes papiers d'identité : passeport, acte de naissance, carte consulaire. Si tu n'en as pas, préviens ton référent tôt : ça peut être long.","Confié(e) à l'ASE au plus tard le jour de tes 16 ans : tu peux obtenir une carte « vie privée et familiale » d'un an.","Confié(e) entre 16 et 18 ans : tu peux obtenir, à titre exceptionnel, une carte « salarié » ou « travailleur temporaire » si tu suis depuis au moins 6 mois une formation qui donne un métier.","Dans les deux cas, la préfecture regarde le sérieux de ta formation, tes liens avec ta famille dans ton pays et l'avis de ta structure d'accueil.","Dépose ta demande à la préfecture (ou en ligne, selon ta préfecture). Garde le récépissé : il prouve que ta demande est en cours.","Réponse négative ou OQTF ? Les délais pour contester sont très courts : va tout de suite voir ton référent, un avocat ou une association."],
  pieces:["Passeport ou carte consulaire, acte de naissance","La décision qui t'a confié(e) à l'ASE","Certificat de scolarité, contrat d'apprentissage ou attestation de formation, bulletins","L'avis de ta structure d'accueil sur ton insertion","Justificatif d'hébergement","Photos d'identité et timbre fiscal (selon le titre)"],
  liens:[["La carte « vie privée et familiale » (article L423-22)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000045137531"],["La carte « salarié » pour les 16-18 ans (article L435-3)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000045137527"],["Les délais de la demande (article R431-5)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000043292776"],["La nationalité française (Code civil, article 21-12)","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032207643"],["Infos pour les jeunes étrangers (InfoMIE)","https://www.infomie.net"]],
  astuce:"Confié(e) à l'ASE depuis au moins 3 ans ? Avant tes 18 ans, tu peux peut-être demander la nationalité française. Demande vite à ton référent : après 18 ans, cette voie n'est plus possible."}

  // ---------- SAUVEGARDE (fichier chiffré avec un code)
  async function bkKey(code, salt){ return deriveKey(code, salt); }
  async function makeBackup(code){
    let docs = [];
    try{ docs = (await store("readonly", s => s.getAll())) || []; }catch(e){}
    const payload = {v:1, date:new Date().toISOString(), st, vault: vMeta(), docs: docs.map(d => ({...d, iv:b64(d.iv), data:b64(d.data), tiv:b64(d.tiv), thumb:b64(d.thumb)}))};
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await bkKey(code, salt);
    const c = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(payload)));
    return JSON.stringify({app:"galere-academy", v:1, salt:b64(salt), iv:b64(iv), data:b64(c)});
  }
  async function readBackup(text, code){
    const f = JSON.parse(text); if(f.app !== "galere-academy") throw new Error("format");
    const key = await bkKey(code, unb64(f.salt));
    const p = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(f.iv)}, key, unb64(f.data))));
    return p;
  }

        <label style="display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem">Code de la sauvegarde (6 chiffres ou plus)<input class="pin" id="bk-code" type="password" inputmode="numeric" autocomplete="new-password" minlength="6"></label>

      ${st.lastBk ? `<span class="foot">Dernière sauvegarde : le ${new Date(st.lastBk).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}.</span>` : ""}
      <p class="foot">Garde le fichier dans un endroit sûr (ton Drive, tes fichiers, Reconnect). Sans le code, personne ne peut l'ouvrir, même pas toi : note-le quelque part. Pour le coffre-fort, il te faudra aussi ton code habituel.</p>`;

  // ---------- COFFRE CHIFFRÉ (photos des papiers, sur le téléphone uniquement)
  const VK = "galere-academy-vault";
  let vKey = null, vTimer = null, vUrls = [], vTries = 0;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = buf => { let s = ""; new Uint8Array(buf).forEach(c => s += String.fromCharCode(c)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const vMeta = () => { try{ return JSON.parse(localStorage.getItem(VK) || "null"); }catch(e){ return null; } };
  const vSupported = () => { try{ return !!(window.crypto && crypto.subtle && window.indexedDB); }catch(e){ return false; } };
  async function deriveKey(pin, salt){
    const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  }
  const aes = async (data) => { const iv = crypto.getRandomValues(new Uint8Array(12)); const c = await crypto.subtle.encrypt({name:"AES-GCM", iv}, vKey, data); return {iv, c}; };
  const unaes = (iv, c, key) => crypto.subtle.decrypt({name:"AES-GCM", iv}, key || vKey, c);
  function idb(){ return new Promise((res, rej) => { const r = indexedDB.open("galere-academy", 1); r.onupgradeneeded = () => r.result.createObjectStore("docs", {keyPath:"id"}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async function store(mode, fn){ const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("docs", mode); const q = fn(t.objectStore("docs")); t.oncomplete = () => { db.close(); res(q && "result" in q ? q.result : undefined); }; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
  function vLock(){ vKey = null; clearTimeout(vTimer); vUrls.forEach(u => URL.revokeObjectURL(u)); vUrls = []; const v = document.querySelector(".viewer"); if(v) v.remove(); }
  function vTouch(){ clearTimeout(vTimer); vTimer = setTimeout(() => { vLock(); if(document.getElementById("vault")) renderVault(); }, 5*60*1000); }
  document.addEventListener("visibilitychange", () => { if(document.hidden && vKey){ vLock(); if(document.getElementById("vault")) renderVault(); } });
  async function shrink(file, max, q){
    const url = URL.createObjectURL(file);
    try{
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth*r); cv.height = Math.round(img.naturalHeight*r);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const blob = await new Promise(res => cv.toBlob(res, "image/jpeg", q));
      return await blob.arrayBuffer();
    } finally { URL.revokeObjectURL(url); }
  }
  async function renderVault(){
    const box = document.getElementById("vault"); if(!box) return;

    if(!vSupported()){ box.innerHTML = head + `</div><p class="lede">Ce téléphone ou ce navigateur ne permet pas de garder des papiers chiffrés. Utilise Reconnect ou France Identité.</p></div>`; return; }

      box.innerHTML = head + `</div>

        <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Tu choisis un code à 6 chiffres. Sans lui, personne ne peut ouvrir tes papiers, même pas ton référent.</li><li><b>Si tu oublies ton code, tes photos sont perdues.</b> Garde toujours les originaux dans ton classeur.</li><li>Si tu changes de téléphone ou si tu vides ton navigateur, les photos disparaissent aussi.</li></ul>
        <form id="vcreate" style="display:grid;gap:10px;grid-template-columns:1fr 1fr">
          <label style="display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem">Mon code (6 chiffres)<input class="pin" id="vp1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" pattern="[0-9]{6}" required></label>
          <label style="display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem">Je le retape<input class="pin" id="vp2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" pattern="[0-9]{6}" required></label>
          <span class="err" id="verr" style="grid-column:1/-1"></span>

      box.querySelector("#vcreate").onsubmit = async e => {

        er.textContent = "Création…";

    if(!vKey){
      box.innerHTML = head + `<span class="stamp" style="color:var(--c-papiers)">Fermé</span></div>
        <form id="vopen" style="display:grid;gap:10px">
          <label style="display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem">Mon code<input class="pin" id="vpin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" required></label>
          <span class="err" id="verr"></span>
          <button class="btn" type="submit">Ouvrir mon coffre</button>
        </form>
        <button class="back" id="vforgot">J'ai oublié mon code</button></div>`;
      box.querySelector("#vopen").onsubmit = async e => {
        e.preventDefault();
        const er = box.querySelector("#verr"); er.textContent = "Ouverture…";
        try{
          const k = await deriveKey(box.querySelector("#vpin").value, unb64(meta.salt));
          const ok = dec.decode(await unaes(unb64(meta.iv), unb64(meta.check), k));
          if(ok !== "galere-ok") throw 0;
          vKey = k; vTries = 0; vTouch(); renderVault();
        }catch(err){ vTries++; er.textContent = "Code incorrect." + (vTries >= 3 ? " Prends ton temps : si tu l'as oublié, tu peux vider le coffre et recommencer." : ""); box.querySelector("#vpin").value = ""; }
      };
      let armed = 0;

      <p class="foot">${docs.length} papier${docs.length>1?"s":""} · ${total < 1048576 ? Math.max(1,Math.round(total/1024)) + " Ko" : (total/1048576).toFixed(1) + " Mo"} · Le coffre se ferme tout seul après 5 minutes ou quand tu quittes l'appli.</p></div>`;

        if(cat !== 99){ st.checks["cf-"+cat] = true; save(); const c = document.getElementById("c-cf-"+cat); if(c) c.checked = true; renderCoffre(); }

    };
    box.querySelectorAll("[data-v]").forEach(b => b.onclick = async () => {

      document.body.appendChild(v);

      if(vsh) vsh.onclick = async () => {

        try{ const blob = await (await fetch(url)).blob(); const f = new File([blob], (GA.coffre[d.cat] || "papier").replace(/[^a-z0-9]+/gi,"-").toLowerCase() + ".jpg", {type:"image/jpeg"}); if(navigator.canShare({files:[f]})) await navigator.share({files:[f], title: GA.coffre[d.cat] || "Papier"}); }catch(err){}

  // ---------- AGENDA
  let calM = null, calSel = null, editR = null;
  const pad = n => String(n).padStart(2,"0");

  const typeOf = id => GA.rdvTypes.find(t => t.id === id) || GA.rdvTypes[GA.rdvTypes.length-1];
  function icsRdv(r){
    if(!r) return;
    const t = typeOf(r.type), e = v => String(v||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");
    const d = r.date.replace(/-/g,""), pad = n => String(n).padStart(2,"0");
    let start, end;
    if(r.heure){ const [h,m] = r.heure.split(":").map(Number), fin = new Date(2000,0,1,h,m+60); start = "DTSTART:" + d + "T" + pad(h) + pad(m) + "00"; end = "DTEND:" + (fin.getDate() > 1 ? isoD(new Date(new Date(r.date+"T12:00").getTime()+86400000)).replace(/-/g,"") : d) + "T" + pad(fin.getHours()) + pad(fin.getMinutes()) + "00"; }
    else { start = "DTSTART;VALUE=DATE:" + d; end = "DTEND;VALUE=DATE:" + isoD(new Date(new Date(r.date+"T12:00").getTime()+86400000)).replace(/-/g,""); }
    const desc = [r.tel ? "Téléphone : " + r.tel : "", r.avec ? "Avec : " + r.avec : "", (r.docs||[]).length ? "À prendre : " + r.docs.map(x => x.t).join(", ") : "", r.notes || ""].filter(Boolean).join("\n");
    const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15) + "Z";
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Galere Academy//FR","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:" + r.id + "@galere-academy.fr","DTSTAMP:" + stamp, start, end, "SUMMARY:" + e((r.objet ? r.objet + " – " : "") + t.nom), r.lieu ? "LOCATION:" + e(r.lieu) : "", desc ? "DESCRIPTION:" + e(desc) : "", "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + e("Rendez-vous demain : " + t.nom),"TRIGGER:-P1D","END:VALARM","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + e("Rendez-vous dans 2 heures : " + t.nom),"TRIGGER:-PT2H","END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
    gc("agenda-telephone", 1);
    const name = "rdv-" + r.date + ".ics", file = new File([ics], name, {type:"text/calendar"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }
  function rdvs(){ return (st.rdv || []).slice().sort((a,b) => (a.date+(a.heure||"")).localeCompare(b.date+(b.heure||""))); }
  function rdvCard(r){
    const t = typeOf(r.type), d = new Date(r.date+"T12:00");

      ${r.objet?`<b>${esc(r.objet)}</b>`:""}
      <div class="meta">${r.lieu?`<span>📍 ${esc(r.lieu)}</span>`:""}${r.tel?`<span>📞 <span class="tel">${esc(r.tel)}</span></span>`:""}${r.avec?`<span>👤 ${esc(r.avec)}</span>`:""}</div>
      ${docs.length?`<div><span class="eyebrow">Je prends avec moi · ${ok}/${docs.length}</span></div><div class="docs">${docs.map((x,k)=>`<label class="chk"><input type="checkbox" data-rd="${r.id}" data-k="${k}" ${x.ok?"checked":""} id="rd-${r.id}-${k}"><span>${esc(x.t)}</span></label>`).join("")}</div>`:""}
      ${r.notes?`<p class="foot">${esc(r.notes)}</p>`:""}
      <div class="row">${!past?`<button class="btn ghost" data-ics="${r.id}" style="padding:8px 12px">📅 Dans l'agenda du téléphone</button>`:""}<button class="btn ghost" data-edit="${r.id}" style="padding:8px 12px">Modifier</button><button class="btn ghost" data-del="${r.id}" style="padding:8px 12px">Supprimer</button></div>

  function vAgenda(){
    const now = new Date();

      <div class="cal">${["L","M","M","J","V","S","D"].map(x=>`<span class="dn">${x}</span>`).join("")}${cells.map(d=>{const k=isoD(d), rs=byDay[k]||[];return `<button data-day="${k}" class="${d.getMonth()!==m?"out":""} ${k===todayIso()?"today":""} ${k===calSel?"sel":""}" aria-label="${d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}${rs.length?", "+rs.length+" rendez-vous":""}">${d.getDate()}${rs.length?`<span class="dots">${rs.slice(0,3).map(r=>`<i data-c="${typeOf(r.type).c}"></i>`).join("")}</span>`:""}</button>`;}).join("")}</div></div>

    if(editR !== null) openForm(editR === "new" ? null : st.rdv.find(x=>x.id===editR));
  }
  function openForm(r){
    editR = r ? r.id : "new";
    const box = $app.querySelector("#formbox");
    const cur = r || {type:"caf", date: calSel || todayIso(), heure:"", objet:"", lieu:"", tel:"", avec:"", notes:"", docs:null};
    let docs = (cur.docs || typeOf(cur.type).docs.map(t => ({t, ok:false}))).map(x => ({...x}));
    const fillOrg = t => {
      const d = dep();
      if(t.id === "referent" || t.id === "as"){ const o = d && d[0] === "31" ? GA.annuaire[0] : null; return o ? {lieu:o.ou, tel:o.tel} : {lieu:"",tel:""}; }
      const n = t.nat ? GA.national.find(x => x.k === t.nat) : (t.id === "banque" ? null : null);
      return {lieu:"", tel: n && n.tel ? n.tel : ""};
    };
    if(!r){ const f = fillOrg(typeOf(cur.type)); cur.lieu = f.lieu; cur.tel = f.tel; }
    box.innerHTML = `<div class="card"><h3>${r?"Modifier le rendez-vous":"Nouveau rendez-vous"}</h3><form class="rf" id="rf">
      <label class="full">Avec qui ?<select id="r-type">${GA.rdvTypes.map(t=>`<option value="${t.id}" ${t.id===cur.type?"selected":""}>${esc(t.nom)}</option>`).join("")}</select></label>
      <label>Date<input type="date" id="r-date" required value="${cur.date}"></label>
      <label>Heure<input type="time" id="r-heure" value="${cur.heure||""}"></label>
      <label class="full">Pour quoi ?<input type="text" id="r-objet" value="${esc(cur.objet||"")}" placeholder="ex. Demande d'APL"></label>
      <label class="full">Adresse<input type="text" id="r-lieu" value="${esc(cur.lieu||"")}" placeholder="Adresse du rendez-vous"><a id="r-find" target="_blank" rel="noopener" style="font-weight:400"></a></label>
      <label>Téléphone<input type="tel" id="r-tel" value="${esc(cur.tel||"")}" placeholder="Numéro"></label>
      <label>Nom de la personne<input type="text" id="r-avec" value="${esc(cur.avec||"")}" placeholder="ex. Mme Martin"></label>
      <div class="full"><span class="eyebrow">Papiers à prendre</span><div class="sugg" id="r-docs"></div>
        <div class="row" style="margin-top:8px"><input type="text" id="r-newdoc" placeholder="Ajouter un papier" style="flex:1"><button type="button" class="btn ghost" id="r-adddoc" style="padding:8px 12px">Ajouter</button></div></div>
      <label class="full">Notes<input type="text" id="r-notes" value="${esc(cur.notes||"")}" placeholder="ex. Arriver 10 min avant, bus de 8 h 12"></label>
      <div class="row full"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="r-cancel">Annuler</button></div>
    </form></div>`;
    const drawDocs = () => {
      const sug = typeOf($app.querySelector("#r-type").value).docs;
      const names = docs.map(x=>x.t);
      const extra = sug.filter(t => !names.includes(t));
      $app.querySelector("#r-docs").innerHTML = docs.map((x,k)=>`<button type="button" aria-pressed="true" data-rm="${k}">✓ ${esc(x.t)}</button>`).join("") + extra.map(t=>`<button type="button" aria-pressed="false" data-ad="${esc(t)}">+ ${esc(t)}</button>`).join("");
      $app.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { docs.splice(+b.dataset.rm,1); drawDocs(); });
      $app.querySelectorAll("[data-ad]").forEach(b => b.onclick = () => { docs.push({t:b.dataset.ad, ok:false}); drawDocs(); });
    };
    drawDocs();
    const autoFill = async () => {
      if(r || !st.loc) return;
      const t = typeOf($app.querySelector("#r-type").value); if(!t.nat || t.id === "referent" || t.id === "as") return;
      try{ await loadData(); }catch(e){ return; }
      const n = nearest(t.nat, 1)[0]; if(!n) return;
      const x = n[1], l = $app.querySelector("#r-lieu"), tl = $app.querySelector("#r-tel"); if(!l) return;
      l.value = [x[1], x[2], (x[3]+" "+x[4]).trim()].filter(Boolean).join(", "); if(x[5]) tl.value = x[5];
    };
    autoFill(); $app.querySelector("#r-type").addEventListener("change", autoFill);
    const drawFind = () => { const t = typeOf($app.querySelector("#r-type").value), a = $app.querySelector("#r-find"), d = dep(); const o = t.nat ? GA.national.find(x => x.k === t.nat) : null; if(o && !(d && d[0]==="31" && (t.id==="referent"||t.id==="as"))){ a.href = near(o) || annu(t.nat); a.textContent = "📍 Trouver l'adresse " + (st.ville ? "la plus proche de " + st.ville : d ? "dans le " + d[0] : "") + " (annuaire officiel)"; a.hidden = false; } else { a.hidden = true; } };
    drawFind();
    $app.querySelector("#r-type").addEventListener("change", drawFind);
    $app.querySelector("#r-type").onchange = e => {
      const t = typeOf(e.target.value), f = fillOrg(t);
      if(!r){ $app.querySelector("#r-lieu").value = f.lieu; $app.querySelector("#r-tel").value = f.tel; docs = t.docs.map(x => ({t:x, ok:false})); }
      drawDocs();
    };
    $app.querySelector("#r-adddoc").onclick = () => { const i = $app.querySelector("#r-newdoc"); if(i.value.trim()){ docs.push({t:i.value.trim(), ok:false}); i.value=""; drawDocs(); } };
    $app.querySelector("#r-cancel").onclick = () => { editR = null; box.innerHTML = ""; };
    $app.querySelector("#rf").onsubmit = e => {
      e.preventDefault();
      const v = id => $app.querySelector(id).value.trim();
      const data = {id: r ? r.id : "r"+Date.now().toString(36), type:v("#r-type"), date:v("#r-date"), heure:v("#r-heure"), objet:v("#r-objet"), lieu:v("#r-lieu"), tel:v("#r-tel"), avec:v("#r-avec"), notes:v("#r-notes"), docs};
      st.rdv = (st.rdv || []).filter(x => x.id !== data.id).concat([data]); save();
      editR = null; calSel = data.date; const d = new Date(data.date+"T12:00"); calM = new Date(d.getFullYear(), d.getMonth(), 1); vAgenda();
    };
    box.scrollIntoView({behavior:"smooth", block:"start"});
  }

  const VIEWS = {accueil:vAccueil, fiches:vFiches, jeux:vJeux, agenda:vAgenda, kit:vKit, contacts:vContacts};
  function route(){
    if(!st.installSeen && !standalone() && !st.onboarded && !(st.prenom || st.naissance || st.loc)){ vInstaller(); gc("/app/installer"); return; }
    if(!st.onboarded && !(st.prenom || st.naissance || st.loc)){ vBienvenue(); gc("/app/bienvenue"); return; }
    document.querySelector("nav.tabs").hidden = false;
    const v = (location.hash||"").replace("#","");
    const name = VIEWS[v] ? v : "accueil";
    document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.v === name ? "page" : "false"));
    if(name !== "fiches") openFiche = null; if(name !== "agenda") editR = null; if(name !== "kit" && vKey) vLock();
    VIEWS[name](); window.scrollTo(0,0); gc("/app/" + name);
  }
  window.addEventListener("hashchange", route);
  document.querySelectorAll("nav.tabs a").forEach(a => a.addEventListener("click", () => { if(a.dataset.v === "jeux") game = null; if(a.dataset.v==="fiches") openFiche = null; if(location.hash === "#"+a.dataset.v) route(); }));
  route();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));}</script>
</body>
</html>
